{% extends "base.html" %}
{% block title %}Revisa tu email — Pádel{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-12 glass rounded-2xl shadow-glow p-8 text-center">
  <div class="text-4xl mb-4">📩</div>
  <h1 class="text-2xl font-bold mb-4 bg-gradient-to-r from-cyan-400 to-violet-400 bg-clip-text text-transparent">
    Revisa tu email
  </h1>
  <p class="text-sm text-slate-400">
    Si existe una cuenta con ese email, te hemos enviado un enlace para restablecer la contraseña.
  </p>
  <p class="mt-4">
    <a href="{% url 'accounts:login' %}" class="text-cyan-400 hover:underline text-sm">Volver a acceder</a>
  </p>
</div>
{% endblock %}
