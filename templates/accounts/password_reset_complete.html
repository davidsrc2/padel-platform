{% extends "base.html" %}
{% block title %}Contraseña actualizada — Pádel{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-12 glass rounded-2xl shadow-glow p-8 text-center">
  <div class="text-4xl mb-4">✅</div>
  <h1 class="text-2xl font-bold mb-4 bg-gradient-to-r from-cyan-400 to-violet-400 bg-clip-text text-transparent">
    Contraseña actualizada
  </h1>
  <p class="text-sm text-slate-400">Ya puedes acceder con tu nueva contraseña.</p>
  <p class="mt-6">
    <a href="{% url 'accounts:login' %}"
      class="inline-block bg-gradient-to-r from-cyan-500 to-violet-500 text-slate-950 px-5 py-2.5 rounded-lg text-sm font-semibold hover:shadow-glowLg transition-shadow">
      Acceder
    </a>
  </p>
</div>
{% endblock %}
