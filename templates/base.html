<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pádel Urbanización{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-green-700 text-white px-6 py-3 flex items-center justify-between shadow">
    <a href="{% url 'reservas:calendario' %}" class="font-bold text-lg tracking-wide">Pádel</a>
    <div class="flex gap-4 text-sm">
      {% if user.is_authenticated %}
        <a href="{% url 'reservas:calendario' %}" class="hover:underline">Calendario</a>
        <a href="{% url 'reservas:mis_reservas' %}" class="hover:underline">Mis reservas</a>
        {% if user.is_staff %}
          <a href="{% url 'admin:index' %}" class="hover:underline">Admin</a>
        {% endif %}
        <form method="post" action="{% url 'accounts:logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="hover:underline">Salir</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="hover:underline">Entrar</a>
        <a href="{% url 'accounts:registro' %}" class="hover:underline">Registrarse</a>
      {% endif %}
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% if messages %}
      <div class="mb-6 space-y-2">
        {% for msg in messages %}
          <div class="px-4 py-3 rounded text-sm
            {% if msg.tags == 'error' %}bg-red-100 text-red-800
            {% elif msg.tags == 'success' %}bg-green-100 text-green-800
            {% else %}bg-blue-100 text-blue-800{% endif %}">
            {{ msg }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
